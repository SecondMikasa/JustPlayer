name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK (No signing required)
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Show build outputs (debug)
        run: |
          echo "Listing app/build/outputs:"
          ls -R app/build/outputs || true
          echo "Find any APKs:"
          find app/build -type f -name "*.apk" -print || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayer-App
          path: app/build/outputs/**/*.apk
